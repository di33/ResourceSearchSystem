<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resource Browser</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  color-scheme: light;
  --bg: #ffffff;
  --panel: #ffffff;
  --panel2: #f8fafc;
  --border: #e2e8f0;
  --text: #18181b;
  --text2: #64748b;
  --accent: #4f46e5;
  --accent2: #4338ca;
  --green: #15803d;
  --red: #dc2626;
  --orange: #b45309;
  --radius: 8px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 20px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}
.topbar h1 { font-size: 16px; font-weight: 600; white-space: nowrap; }
.topbar .stats { font-size: 13px; color: var(--text2); display: flex; flex-wrap: wrap; gap: 16px; }
.topbar .stats .stat-val { color: var(--accent2); font-weight: 600; }
.topbar .search-box {
  margin-left: auto;
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  justify-content: flex-end;
}
.topbar .search-box .search-input {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  padding: 7px 12px 7px 32px;
  font-size: 13px;
  width: min(340px, 38vw);
  outline: none;
}
.topbar .search-box .search-input:focus { border-color: var(--accent); }
.topbar .search-box .search-icon {
  position: absolute;
  left: 9px;
  top: 50%;
  transform: translateY(-50%);
  width: 15px;
  height: 15px;
  color: var(--text2);
}
button {
  background: var(--accent);
  border: 1px solid var(--accent);
  color: #fff;
  border-radius: var(--radius);
  padding: 7px 12px;
  font-size: 13px;
  cursor: pointer;
}
button:hover { background: var(--accent2); }
button.secondary {
  background: var(--panel2);
  border-color: var(--border);
  color: var(--text);
}
button.secondary:hover { border-color: var(--accent2); }
button:disabled { opacity: .55; cursor: default; }
.search-status {
  font-size: 12px;
  color: var(--text2);
  min-width: 96px;
}
.advanced-search {
  position: relative;
}
.advanced-search summary {
  display: inline-flex;
  align-items: center;
  height: 34px;
  list-style: none;
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  cursor: pointer;
  font-size: 13px;
  padding: 0 12px;
  user-select: none;
}
.advanced-search summary::-webkit-details-marker { display: none; }
.advanced-search[open] summary {
  border-color: var(--accent2);
}
.advanced-search-panel {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  z-index: 40;
  display: grid;
  grid-template-columns: repeat(2, minmax(130px, 1fr));
  gap: 10px;
  width: min(430px, calc(100vw - 32px));
  padding: 12px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
}
.advanced-search-panel::before {
  content: "";
  position: absolute;
  top: -7px;
  right: 28px;
  width: 12px;
  height: 12px;
  background: var(--panel);
  border-left: 1px solid var(--border);
  border-top: 1px solid var(--border);
  transform: rotate(45deg);
}

.app {
  width: 100%;
  max-width: 1760px;
  margin: 0 auto;
  padding: 18px 24px 36px;
}

.toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}
.toolbar .summary {
  font-size: 13px;
  color: var(--text2);
  margin-right: auto;
}
.toolbar select {
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: var(--radius);
  font-size: 13px;
  padding: 7px 10px;
  min-width: 150px;
  outline: none;
}
.toolbar select:focus { border-color: var(--accent); }
.search-control {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.search-control label {
  color: var(--text2);
  font-size: 11px;
  font-weight: 600;
}
.search-control select,
.search-control input {
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: var(--radius);
  font-size: 13px;
  height: 34px;
  padding: 7px 10px;
  outline: none;
}
.search-control input[type="number"] {
  width: 96px;
}
.search-control select:focus,
.search-control input:focus {
  border-color: var(--accent);
}
.search-control.search-control-wide {
  min-width: 190px;
}

.resource-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: 14px;
  align-items: stretch;
}
.resource-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  min-width: 0;
  transition: border-color .12s, transform .12s, background .12s;
}
.resource-card:hover {
  border-color: var(--accent2);
  background: #f8fafc;
  transform: translateY(-1px);
}
.thumb {
  aspect-ratio: 1 / 1;
  background: repeating-conic-gradient(#f1f5f9 0% 25%, #ffffff 0% 50%) 0 0 / 18px 18px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.thumb img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}
.thumb .placeholder {
  color: var(--text2);
  font-size: 12px;
}
.card-body { padding: 10px 11px 11px; min-width: 0; }
.card-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 8px;
}
.card-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.pill {
  display: inline-flex;
  align-items: center;
  border-radius: 3px;
  padding: 2px 6px;
  font-size: 10px;
  font-weight: 600;
  white-space: nowrap;
}
.pill-type { background: rgba(99,102,241,.15); color: var(--accent2); }
.badge-ok { background: rgba(34,197,94,.15); color: var(--green); }
.badge-partial { background: rgba(245,158,11,.15); color: var(--orange); }
.badge-fail { background: rgba(239,68,68,.15); color: var(--red); }
.count-pill {
  margin-left: auto;
  color: var(--text2);
  font-size: 11px;
  white-space: nowrap;
}

.pager {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px 0 4px;
}
.empty-state {
  min-height: 360px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text2);
  font-size: 14px;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
}

.detail { max-width: 1320px; margin: 0 auto; }
.detail-nav { margin-bottom: 18px; }
.detail-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 420px;
  color: var(--text2);
  font-size: 14px;
  gap: 10px;
}
.detail-header { margin-bottom: 24px; }
.detail-header h2 { font-size: 22px; font-weight: 650; margin-bottom: 6px; word-break: break-all; }
.detail-header .meta { font-size: 13px; color: var(--text2); display: flex; flex-wrap: wrap; gap: 16px; margin-top: 8px; }
.detail-header .meta span { display: flex; align-items: center; gap: 4px; }
.detail-header .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.download-action {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.download-button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--accent);
  border: 1px solid var(--accent);
  color: #fff;
  border-radius: var(--radius);
  padding: 7px 12px;
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
}
.download-button:hover { background: var(--accent2); }
.download-button.package-download {
  background: var(--panel2);
  border-color: var(--accent2);
  color: var(--text);
}
.download-button.package-download:hover { background: #eef2ff; }
.download-meta {
  display: inline-flex;
  align-items: center;
  color: var(--text2);
  font-size: 12px;
  min-width: 0;
  max-width: min(560px, 46vw);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.section { margin-bottom: 28px; }
.section-title {
  font-size: 13px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .04em;
  color: var(--text2);
  margin-bottom: 12px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}
.preview-grid { display: flex; flex-wrap: wrap; gap: 12px; }
.preview-card {
  display: inline-flex;
  flex-direction: column;
  width: var(--preview-display-width, fit-content);
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  max-width: 360px;
}
.preview-zoom-trigger {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--preview-display-width, auto);
  border: 0;
  padding: 0;
  background: transparent;
  cursor: zoom-in;
}
.preview-card img {
  display: block;
  width: var(--preview-display-width, auto);
  height: var(--preview-display-height, auto);
  max-width: 360px;
  max-height: 300px;
  object-fit: contain;
  background: transparent;
}
.preview-card .label {
  width: 100%;
  padding: 6px 10px;
  font-size: 11px;
  color: var(--text2);
  border-top: 1px solid var(--border);
  overflow-wrap: anywhere;
}

.preview-lightbox {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px;
  background: rgba(3, 3, 5, 0.88);
}
.preview-lightbox.hidden {
  display: none !important;
}
.preview-lightbox-dialog {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  width: auto;
  max-width: calc(100vw - 56px);
  max-height: 92vh;
}
.preview-lightbox-close {
  position: absolute;
  top: -8px;
  right: -8px;
  width: 36px;
  height: 36px;
  border-radius: 999px;
  padding: 0;
  font-size: 24px;
  line-height: 1;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
}
.preview-lightbox-toolbar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 44px;
}
.preview-lightbox-tool {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 30px;
  padding: 0;
  background: var(--panel2);
  border-color: var(--border);
  color: var(--text);
}
.preview-lightbox-tool:hover { border-color: var(--accent2); }
.preview-lightbox-tool-wide {
  width: auto;
  min-width: 52px;
  padding: 0 10px;
}
.preview-lightbox-zoom-level {
  min-width: 54px;
  color: var(--text);
  font-size: 12px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.preview-lightbox-viewport {
  width: fit-content;
  height: fit-content;
  max-width: calc(100vw - 56px);
  max-height: calc(92vh - 86px);
  min-width: 0;
  min-height: 0;
  overflow: auto;
  border-radius: var(--radius);
  background: transparent;
  overscroll-behavior: contain;
}
.preview-lightbox-viewport.is-draggable { cursor: grab; }
.preview-lightbox-viewport.is-dragging {
  cursor: grabbing;
  user-select: none;
}
.preview-lightbox-stage {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 0;
  width: fit-content;
  height: fit-content;
  padding: 0;
}
.preview-lightbox-image {
  flex: 0 0 auto;
  display: block;
  border-radius: var(--radius);
  max-width: none;
  max-height: none;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
}
.preview-lightbox-caption {
  color: var(--text2);
  font-size: 12px;
  text-align: center;
}

.file-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.file-table th {
  text-align: left;
  font-size: 11px;
  font-weight: 600;
  color: var(--text2);
  padding: 6px 12px;
  border-bottom: 1px solid var(--border);
}
.file-table td {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
}
.file-table tr:hover td { background: rgba(99,102,241,.05); }
.file-table .dl-link {
  color: var(--accent2);
  text-decoration: none;
  font-size: 12px;
}
.file-table .dl-link:hover { text-decoration: underline; }

.desc-block {
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  font-size: 14px;
  line-height: 1.7;
}
.desc-block .desc-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--accent2);
  margin-bottom: 4px;
}
.desc-block .desc-text { color: var(--text); margin-bottom: 12px; white-space: pre-wrap; }
.desc-block .desc-text:last-child { margin-bottom: 0; }

.embed-info { display: flex; flex-wrap: wrap; gap: 12px; }
.embed-chip {
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 16px;
  font-size: 13px;
}
.embed-chip .label { font-size: 11px; color: var(--text2); margin-bottom: 2px; }
.embed-chip .value { font-weight: 600; }

.hidden { display: none !important; }
.spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 760px) {
  .topbar { align-items: stretch; flex-direction: column; gap: 10px; }
  .topbar .search-box { margin-left: 0; width: 100%; }
  .topbar .search-box .search-input { width: 100%; }
  .advanced-search { position: static; }
  .advanced-search-panel {
    position: fixed;
    left: 12px;
    right: 12px;
    top: 132px;
    width: auto;
    grid-template-columns: 1fr 1fr;
  }
  .toolbar { align-items: stretch; flex-direction: column; }
  .toolbar .summary { margin-right: 0; }
  .toolbar select { width: 100%; }
  .search-control.search-control-wide { grid-column: 1 / -1; }
  .search-control input[type="number"] { width: 100%; }
  .app { padding: 14px 12px 28px; }
  .resource-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .download-action { width: 100%; }
  .download-meta { max-width: 100%; }
  .preview-lightbox { padding: 16px; }
  .preview-lightbox-dialog {
    width: auto;
    max-width: calc(100vw - 32px);
    max-height: calc(100vh - 32px);
  }
  .preview-lightbox-close {
    top: 8px;
    right: 8px;
  }
  .preview-lightbox-toolbar {
    justify-content: flex-start;
    padding: 0 44px 0 0;
    overflow-x: auto;
  }
  .preview-lightbox-viewport {
    max-width: calc(100vw - 32px);
    max-height: calc(100vh - 132px);
  }
}
</style>
</head>
<body>

<div class="topbar">
  <h1>Resource Browser</h1>
  <div class="stats" id="stats"></div>
  <div class="search-box">
    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input class="search-input" type="text" id="searchInput" placeholder="Search resources">
    <details class="advanced-search" id="advancedSearch">
      <summary>Advanced</summary>
      <div class="advanced-search-panel">
        <div class="search-control">
          <label for="topKInput">Top K</label>
          <input id="topKInput" type="number" min="1" max="120" step="1" value="36">
        </div>
        <div class="search-control">
          <label for="thresholdInput">Threshold</label>
          <input id="thresholdInput" type="number" min="0" max="1" step="0.05" value="0.5">
        </div>
        <div class="search-control">
          <label for="bm25WeightInput">BM25 Weight</label>
          <input id="bm25WeightInput" type="number" min="0" max="1" step="0.05" value="0.5">
        </div>
        <div class="search-control search-control-wide">
          <label for="formatFilterInput">Formats</label>
          <input id="formatFilterInput" type="text" placeholder="All formats">
        </div>
        <div class="search-control">
          <label for="searchModeSelect">Search Mode</label>
          <select id="searchModeSelect">
            <option value="hybrid">Hybrid</option>
            <option value="vector">Vector</option>
            <option value="bm25">BM25</option>
          </select>
        </div>
        <div class="search-control">
          <label for="rerankerSelect">Reranker</label>
          <select id="rerankerSelect">
            <option value="">Default</option>
            <option value="true">On</option>
            <option value="false">Off</option>
          </select>
        </div>
      </div>
    </details>
    <button id="searchButton" type="button">Search</button>
    <span class="search-status" id="searchStatus"></span>
  </div>
</div>

<main class="app">
  <section id="gridView">
    <div class="toolbar">
      <div class="summary" id="resultSummary">Loading resources...</div>
      <select id="typeFilter"><option value="">All Types</option></select>
    </div>
    <div class="resource-grid" id="resourceGrid"></div>
    <div class="pager">
      <button id="loadMoreButton" class="secondary" type="button">Load More</button>
    </div>
  </section>

  <section id="detailView" class="detail hidden">
    <div class="detail-nav">
      <button id="backButton" class="secondary" type="button">Back to Browse</button>
    </div>
    <div id="detail"></div>
  </section>
</main>

<div id="previewLightbox" class="preview-lightbox hidden" aria-hidden="true">
  <div class="preview-lightbox-dialog">
    <button id="previewLightboxClose" class="preview-lightbox-close" type="button" aria-label="Close preview">&times;</button>
    <div class="preview-lightbox-toolbar" aria-label="Preview zoom controls">
      <button id="previewZoomOut" class="preview-lightbox-tool" type="button" aria-label="Zoom out" title="Zoom out">-</button>
      <span id="previewZoomLevel" class="preview-lightbox-zoom-level">100%</span>
      <button id="previewZoomIn" class="preview-lightbox-tool" type="button" aria-label="Zoom in" title="Zoom in">+</button>
      <button id="previewZoomReset" class="preview-lightbox-tool preview-lightbox-tool-wide" type="button" aria-label="Reset zoom" title="Reset zoom">Reset</button>
    </div>
    <div id="previewLightboxViewport" class="preview-lightbox-viewport">
      <div class="preview-lightbox-stage">
        <img id="previewLightboxImage" class="preview-lightbox-image" alt="Preview zoom" draggable="false">
      </div>
    </div>
    <div id="previewLightboxCaption" class="preview-lightbox-caption"></div>
  </div>
</div>

<script>
const API = '';
const PAGE_SIZE = 72;

const state = {
  page: 1,
  pageSize: PAGE_SIZE,
  total: 0,
  resources: [],
  typeCounts: {},
  searchTypeCounts: {},
  searchTypeCountsKey: '',
  resourceType: '',
  query: '',
  topK: 36,
  similarityThreshold: 0.5,
  searchMode: 'hybrid',
  bm25Weight: 0.5,
  enableReranker: '',
  formatFilter: '',
  loading: false,
  activeId: null,
  loadedBrowseKey: '',
};

const lightbox = {
  root: null,
  viewport: null,
  image: null,
  caption: null,
  zoomLevel: null,
  zoomIn: null,
  zoomOut: null,
  zoomReset: null,
  zoom: 1,
  naturalWidth: 0,
  naturalHeight: 0,
  isDragging: false,
  dragStartX: 0,
  dragStartY: 0,
  scrollStartLeft: 0,
  scrollStartTop: 0,
};

const PREVIEW_ZOOM_MIN = 0.25;
const PREVIEW_ZOOM_MAX = 5;
const PREVIEW_ZOOM_STEP = 0.25;

function humanSize(b) {
  b = Number(b) || 0;
  for (const u of ['B','KB','MB','GB']) {
    if (b < 1024) return b.toFixed(b < 10 ? 1 : 0) + ' ' + u;
    b /= 1024;
  }
  return b.toFixed(1) + ' TB';
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;',
  }[ch]));
}

function escapeAttr(value) {
  return escapeHtml(value).replace(/`/g, '&#96;');
}

function shortObjectKey(value) {
  const text = String(value || '');
  return text.length > 72 ? '...' + text.slice(-69) : text;
}

function resourceDownloadUrl(resourceId, kind) {
  return `${API}/resources/${encodeURIComponent(resourceId)}/download?kind=${encodeURIComponent(kind)}`;
}

function resourceFileDownloadUrl(resourceId, fileId) {
  return `${API}/resources/${encodeURIComponent(resourceId)}/files/${encodeURIComponent(fileId)}/download`;
}

function bindPreviewZoom(scope) {
  if (!scope) return;
  scope.querySelectorAll('[data-preview-src]').forEach(node => {
    node.addEventListener('click', () => {
      openPreviewLightbox(
        node.getAttribute('data-preview-src'),
        node.getAttribute('data-preview-caption') || ''
      );
    });
    const image = node.querySelector('img');
    if (image) {
      const syncPreviewCardSize = () => {
        const card = node.closest('.preview-card');
        if (!card || !image.naturalWidth || !image.naturalHeight) return;
        const scale = Math.min(1, 360 / image.naturalWidth, 300 / image.naturalHeight);
        card.style.setProperty('--preview-display-width', `${Math.round(image.naturalWidth * scale)}px`);
        card.style.setProperty('--preview-display-height', `${Math.round(image.naturalHeight * scale)}px`);
      };
      if (image.complete) syncPreviewCardSize();
      else image.addEventListener('load', syncPreviewCardSize, { once: true });
    }
  });
}

function clampPreviewZoom(value) {
  return Math.min(PREVIEW_ZOOM_MAX, Math.max(PREVIEW_ZOOM_MIN, value));
}

function updatePreviewDragState() {
  if (!lightbox.viewport) return;
  const canDrag = lightbox.viewport.scrollWidth > lightbox.viewport.clientWidth
    || lightbox.viewport.scrollHeight > lightbox.viewport.clientHeight;
  lightbox.viewport.classList.toggle('is-draggable', canDrag);
}

function applyPreviewZoom(nextZoom, anchor) {
  if (!lightbox.image || !lightbox.viewport) return;
  const viewport = lightbox.viewport;
  const oldZoom = lightbox.zoom || 1;
  const zoom = clampPreviewZoom(nextZoom);
  const point = anchor || {
    x: viewport.clientWidth / 2,
    y: viewport.clientHeight / 2,
  };
  const scrollRatioX = (viewport.scrollLeft + point.x) / oldZoom;
  const scrollRatioY = (viewport.scrollTop + point.y) / oldZoom;
  lightbox.zoom = zoom;
  lightbox.image.style.width = `${lightbox.naturalWidth * zoom}px`;
  lightbox.image.style.height = `${lightbox.naturalHeight * zoom}px`;
  if (lightbox.zoomLevel) {
    lightbox.zoomLevel.textContent = `${Math.round(zoom * 100)}%`;
  }
  requestAnimationFrame(() => {
    viewport.scrollLeft = scrollRatioX * zoom - point.x;
    viewport.scrollTop = scrollRatioY * zoom - point.y;
    updatePreviewDragState();
  });
}

function fitPreviewZoom() {
  if (!lightbox.image || !lightbox.viewport || !lightbox.naturalWidth || !lightbox.naturalHeight) {
    applyPreviewZoom(1);
    return;
  }
  const viewport = lightbox.viewport;
  const fitZoom = Math.min(
    1,
    viewport.clientWidth / lightbox.naturalWidth,
    viewport.clientHeight / lightbox.naturalHeight
  );
  applyPreviewZoom(fitZoom);
}

function resetPreviewLightboxImage() {
  if (!lightbox.image) return;
  lightbox.naturalWidth = 0;
  lightbox.naturalHeight = 0;
  lightbox.zoom = 1;
  lightbox.image.style.width = '';
  lightbox.image.style.height = '';
  if (lightbox.zoomLevel) lightbox.zoomLevel.textContent = '100%';
  if (lightbox.viewport) {
    lightbox.viewport.scrollLeft = 0;
    lightbox.viewport.scrollTop = 0;
    lightbox.viewport.classList.remove('is-draggable', 'is-dragging');
  }
}

function openPreviewLightbox(src, caption) {
  if (!src || !lightbox.root || !lightbox.image || !lightbox.caption) return;
  resetPreviewLightboxImage();
  lightbox.image.src = src;
  lightbox.caption.textContent = caption;
  lightbox.root.classList.remove('hidden');
  lightbox.root.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}

function closePreviewLightbox() {
  if (!lightbox.root || !lightbox.image || !lightbox.caption) return;
  lightbox.root.classList.add('hidden');
  lightbox.root.setAttribute('aria-hidden', 'true');
  lightbox.image.removeAttribute('src');
  lightbox.caption.textContent = '';
  resetPreviewLightboxImage();
  document.body.style.overflow = '';
}

const RESOURCE_TYPES = Object.freeze({
  PACK: 'pack',
  TILED_MAP: 'tiled_map',
  SINGLE_IMAGE: 'single_image',
  MODEL: 'model',
  IMAGE: 'image',
  OTHER: 'other',
});

const RESOURCE_TYPE_LABELS = Object.freeze({
  [RESOURCE_TYPES.MODEL]: 'Models',
  [RESOURCE_TYPES.IMAGE]: 'Images',
  [RESOURCE_TYPES.SINGLE_IMAGE]: 'Single Images',
  [RESOURCE_TYPES.PACK]: 'Packs',
  [RESOURCE_TYPES.TILED_MAP]: 'Tiled Maps',
  [RESOURCE_TYPES.OTHER]: 'Others',
});

const PREFERRED_RESOURCE_TYPES = Object.freeze([
  RESOURCE_TYPES.PACK,
  RESOURCE_TYPES.TILED_MAP,
  RESOURCE_TYPES.SINGLE_IMAGE,
  RESOURCE_TYPES.MODEL,
  RESOURCE_TYPES.IMAGE,
  RESOURCE_TYPES.OTHER,
]);

function typeLabel(t) {
  return RESOURCE_TYPE_LABELS[t] || t || 'Other';
}

function statusBadge(r) {
  if (typeof r.score === 'number') return `<span class="pill badge-ok">${r.score.toFixed(2)}</span>`;
  if (r.process_state && r.process_state !== 'committed') {
    return `<span class="pill badge-partial">${escapeHtml(r.process_state)}</span>`;
  }
  if (r.has_description && r.has_embedding) return '<span class="pill badge-ok">OK</span>';
  if (r.has_description && !r.has_embedding) return '<span class="pill badge-partial">No Vec</span>';
  if (!r.has_description && r.has_embedding) return '<span class="pill badge-partial">No Desc</span>';
  return '<span class="pill badge-fail">Missing</span>';
}

function setLoading(text) {
  document.getElementById('searchStatus').textContent = text || '';
}

async function loadStats() {
  const stats = document.getElementById('stats');
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 8000);
  stats.textContent = 'Loading stats...';
  try {
    const r = await fetch(API + '/stats', { signal: controller.signal });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    const effectiveVectorCount = d.db_embedding_count ?? d.milvus_vector_count;
    stats.innerHTML =
      `<span>DB: <span class="stat-val">${d.db_resource_count}</span></span>` +
      `<span>Vectors: <span class="stat-val">${effectiveVectorCount}</span></span>`;
  } catch(e) {
    stats.textContent = e.name === 'AbortError' ? 'Stats timed out' : 'Failed to load stats';
  } finally {
    clearTimeout(timeout);
  }
}

function browseParams(page) {
  const params = new URLSearchParams();
  params.set('page', String(page));
  params.set('page_size', String(state.pageSize));
  params.set('include_counts', page === 1 ? 'true' : 'false');
  if (state.resourceType) params.set('resource_type', state.resourceType);
  return params;
}

function parseNumber(value, fallback, min, max) {
  if (value === null || value === undefined || value === '') return fallback;
  const n = Number(value);
  if (!Number.isFinite(n)) return fallback;
  return Math.min(max, Math.max(min, n));
}

function formatFilterValues() {
  return String(state.formatFilter || '')
    .split(',')
    .map(v => v.trim().replace(/^\./, '').toLowerCase())
    .filter(Boolean);
}

function searchBody() {
  const body = {
    query_text: state.query,
    resource_type: state.resourceType || null,
    format_filter: formatFilterValues(),
    top_k: state.topK,
    similarity_threshold: state.similarityThreshold,
    search_mode: state.searchMode,
    bm25_weight: state.bm25Weight,
  };
  if (!body.format_filter.length) body.format_filter = null;
  if (state.enableReranker === 'true') body.enable_reranker = true;
  if (state.enableReranker === 'false') body.enable_reranker = false;
  return body;
}

function resultFromSearchItem(item) {
  return {
    resource_id: item.resource_id,
    source_resource_id: item.source_resource_id || '',
    title: item.title || item.resource_id,
    display_title: item.title || item.resource_id,
    content_md5: '',
    resource_type: item.resource_type,
    process_state: item.status || '',
    file_count: item.file_count || 0,
    preview_count: item.primary_preview_url ? 1 + (item.other_preview_urls || []).length : 0,
    has_description: !!item.description_summary,
    has_embedding: Number(item.vector_score || 0) > 0,
    preview_url: item.primary_preview_url || '',
    score: Number(item.score || 0),
  };
}

function countResourceTypes(resources) {
  const counts = {};
  for (const item of resources) {
    const type = item.resource_type || RESOURCE_TYPES.OTHER;
    counts[type] = (counts[type] || 0) + 1;
  }
  return counts;
}

function searchTypeCountsKey() {
  return JSON.stringify({
    query: state.query,
    topK: state.topK,
    similarityThreshold: state.similarityThreshold,
    searchMode: state.searchMode,
    bm25Weight: state.bm25Weight,
    enableReranker: state.enableReranker,
    formatFilter: formatFilterValues(),
  });
}

function browseViewKey() {
  return JSON.stringify({
    query: state.query,
    resourceType: state.resourceType,
    topK: state.topK,
    similarityThreshold: state.similarityThreshold,
    searchMode: state.searchMode,
    bm25Weight: state.bm25Weight,
    enableReranker: state.enableReranker,
    formatFilter: formatFilterValues(),
  });
}

async function loadSearchTypeCounts(key) {
  const body = searchBody();
  body.resource_type = null;
  const r = await fetch(API + '/search', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const d = await r.json();
  const resources = (d.results || []).map(resultFromSearchItem);
  state.searchTypeCounts = countResourceTypes(resources);
  state.searchTypeCountsKey = key;
  return state.searchTypeCounts;
}

async function loadSearchResults({ reset = false, sync = true } = {}) {
  if (reset) {
    state.page = 1;
    state.resources = [];
    renderGrid(true);
  }
  const body = searchBody();
  const r = await fetch(API + '/search', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const d = await r.json();
  const resources = (d.results || []).map(resultFromSearchItem);
  state.total = d.total_count || resources.length;
  state.resources = resources;
  const key = searchTypeCountsKey();
  const currentTypeCounts = countResourceTypes(resources);
  if (state.resourceType) {
    if (state.searchTypeCountsKey !== key || !Object.keys(state.searchTypeCounts).length) {
      try {
        await loadSearchTypeCounts(key);
      } catch {
        state.searchTypeCounts = currentTypeCounts;
        state.searchTypeCountsKey = key;
      }
    }
    state.typeCounts = { ...state.searchTypeCounts };
  } else {
    state.searchTypeCounts = currentTypeCounts;
    state.searchTypeCountsKey = key;
    state.typeCounts = currentTypeCounts;
  }
  state.page = 2;
  populateFilters();
  renderGrid(false);
  if (sync) syncBrowseUrl(false);
}

async function loadResources({ reset = false, sync = true } = {}) {
  if (state.loading) return;
  state.loading = true;
  setLoading(reset ? (state.query ? 'Searching...' : 'Loading...') : 'Loading more...');
  if (reset) {
    state.page = 1;
    state.resources = [];
    renderGrid(true);
  }

  try {
    if (state.query) {
      await loadSearchResults({ reset: false, sync });
    } else {
      state.searchTypeCounts = {};
      state.searchTypeCountsKey = '';
      const r = await fetch(API + `/browse/resources?${browseParams(state.page)}`);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const d = await r.json();
      state.total = d.total || 0;
      if (d.type_counts) state.typeCounts = d.type_counts;
      const newResources = d.resources || [];
      state.resources = reset ? newResources : state.resources.concat(newResources);
      state.page += 1;
      if (reset) populateFilters();
      if (reset) {
        renderGrid(false);
      } else {
        appendResourceCards(newResources);
      }
      if (sync) syncBrowseUrl(false);
    }
    state.loadedBrowseKey = browseViewKey();
    state.loading = false;
    setLoading('');
    updateGridChrome();
  } catch(e) {
    state.loading = false;
    setLoading('Load failed');
    updateGridChrome();
    document.getElementById('resourceGrid').innerHTML =
      `<div class="empty-state">Failed to load resources: ${escapeHtml(e.message)}</div>`;
  } finally {
    state.loading = false;
  }
}

function populateFilters() {
  const typeSelect = document.getElementById('typeFilter');
  const currentType = state.resourceType;

  const typeEntries = Object.entries(state.typeCounts).sort((a, b) => {
    const ai = PREFERRED_RESOURCE_TYPES.indexOf(a[0]);
    const bi = PREFERRED_RESOURCE_TYPES.indexOf(b[0]);
    if (ai !== -1 || bi !== -1) return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
    return a[0].localeCompare(b[0]);
  });
  if (currentType && !state.typeCounts[currentType]) typeEntries.unshift([currentType, 0]);
  const typeOptions = '<option value="">All Types</option>' +
    typeEntries.map(([type, count]) =>
      `<option value="${escapeAttr(type)}">${escapeHtml(typeLabel(type))} (${count})</option>`
    ).join('');
  typeSelect.innerHTML = typeOptions;
  typeSelect.value = currentType;
}

function updateGridChrome() {
  const shown = state.resources.length;
  const noun = state.query ? 'search results' : 'resources';
  document.getElementById('resultSummary').textContent =
    `${shown} / ${state.total} ${noun}${state.query ? ` for "${state.query}"` : ''}`;

  const loadMore = document.getElementById('loadMoreButton');
  loadMore.classList.toggle('hidden', !!state.query || shown >= state.total || state.total === 0);
  loadMore.disabled = state.loading;
}

function appendResourceCards(resources) {
  updateGridChrome();
  if (!resources.length) return;
  const grid = document.getElementById('resourceGrid');
  if (!grid.querySelector('.resource-card')) {
    grid.innerHTML = '';
  }
  const template = document.createElement('template');
  template.innerHTML = resources.map(renderCard).join('');
  grid.appendChild(template.content);
}

function renderGrid(isLoading) {
  const grid = document.getElementById('resourceGrid');
  updateGridChrome();

  if (isLoading) {
    grid.innerHTML = '<div class="empty-state"><span class="spinner"></span></div>';
  } else if (!state.resources.length) {
    grid.innerHTML = '<div class="empty-state">No resources found</div>';
  } else {
    grid.innerHTML = state.resources.map(renderCard).join('');
  }
}

function renderCard(r) {
  const id = r.resource_id || r.content_md5;
  const name = r.display_title || r.title || r.resource_id || (r.content_md5 || '').slice(0, 12);
  const title = [r.display_title, r.title, r.resource_id, r.source_resource_id].filter(Boolean).join('\n');
  const preview = r.preview_url
    ? `<img src="${escapeAttr(r.preview_url)}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<span class=\\'placeholder\\'>No preview</span>'">`
    : '<span class="placeholder">No preview</span>';
  return `
    <article class="resource-card" data-id="${escapeAttr(id)}" title="${escapeAttr(title || id)}">
      <div class="thumb">${preview}</div>
      <div class="card-body">
        <div class="card-title">${escapeHtml(name)}</div>
        <div class="card-meta">
          <span class="pill pill-type">${escapeHtml(typeLabel(r.resource_type))}</span>
          ${statusBadge(r)}
          <span class="count-pill">${Number(r.file_count || 0)} files</span>
        </div>
      </div>
    </article>`;
}

function showGrid(push = true) {
  state.activeId = null;
  document.getElementById('gridView').classList.remove('hidden');
  document.getElementById('detailView').classList.add('hidden');
  if (push) syncBrowseUrl(true);
}

async function selectResource(id, push) {
  if (!id) return;
  if (push) rememberGridHistoryState();
  state.activeId = id;
  document.getElementById('gridView').classList.add('hidden');
  document.getElementById('detailView').classList.remove('hidden');
  const detail = document.getElementById('detail');
  detail.innerHTML = '<div class="detail-empty"><span class="spinner"></span><span>Loading...</span></div>';
  if (push) syncDetailUrl(id);

  try {
    const r = await fetch(API + `/resources/${encodeURIComponent(id)}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    renderDetail(await r.json());
  } catch(e) {
    detail.innerHTML = `<div class="detail-empty"><span style="color:var(--red)">Failed to load: ${escapeHtml(e.message)}</span></div>`;
  }
}

function renderDetail(d) {
  const panel = document.getElementById('detail');
  const rid = d.resource_id;
  const isPack = d.resource_type === RESOURCE_TYPES.PACK;
  let html = '<div class="detail-header">';
  html += `<h2>${escapeHtml(d.display_title || d.title || d.resource_id || d.content_md5)}</h2>`;
  html += '<div class="meta">';
  html += `<span>ID: <b>${escapeHtml(d.resource_id || '-')}</b></span>`;
  html += `<span>Type: <b>${escapeHtml(d.resource_type)}</b></span>`;
  html += `<span>State: <b>${escapeHtml(d.process_state)}</b></span>`;
  html += `<span>MD5: <code style="font-size:12px">${escapeHtml(d.content_md5)}</code></span>`;
  html += `<span>Created: ${escapeHtml(d.created_at)}</span>`;
  html += `<span>Updated: ${escapeHtml(d.updated_at)}</span>`;
  if (d.source_directory) html += `<span>Source: <code style="font-size:12px">${escapeHtml(d.source_directory)}</code></span>`;
  html += '</div>';

  const downloads = [];
  if (rid && d.source_object_key) {
    downloads.push({
      label: 'Download Resource',
      url: resourceDownloadUrl(rid, 'source'),
      key: d.source_object_key,
      kind: 'resource',
    });
  }
  if (rid && d.package_object_key) {
    downloads.push({
      label: 'Download Package',
      url: resourceDownloadUrl(rid, 'package'),
      key: d.package_object_key,
      kind: 'package',
    });
  }
  if (downloads.length) {
    html += '<div class="actions">';
    for (const item of downloads) {
      const buttonClass = item.kind === 'package' ? 'download-button package-download' : 'download-button';
      html += '<div class="download-action">';
      html += `<a class="${buttonClass}" href="${escapeAttr(item.url)}">${escapeHtml(item.label)}</a>`;
      if (item.key) {
        html += `<span class="download-meta" title="${escapeAttr(item.key)}">${escapeHtml(shortObjectKey(item.key))}</span>`;
      }
      html += '</div>';
    }
    html += '</div>';
  }
  html += '</div>';

  html += '<div class="section"><div class="section-title">Previews</div>';
  if (d.previews && d.previews.length) {
    html += '<div class="preview-grid">';
    for (let i = 0; i < d.previews.length; i++) {
      const p = d.previews[i];
      const previewMeta = `Role: ${p.role || '-'} | Strategy: ${p.strategy || '-'}${p.format ? ' | ' + p.format : ''}${p.width ? ' | ' + p.width + 'x' + p.height : ''}`;
      html += '<div class="preview-card">';
      if (p.preview_url) {
        html += `<button class="preview-zoom-trigger" type="button" data-preview-src="${escapeAttr(p.preview_url)}" data-preview-caption="${escapeAttr(previewMeta)}"><img src="${escapeAttr(p.preview_url)}" alt="preview" loading="lazy" onerror="this.parentElement.outerHTML='<div style=\\'padding:20px;color:var(--text2);font-size:12px\\'>No preview available</div>'"></button>`;
      } else {
        html += '<div style="padding:20px;color:var(--text2);font-size:12px">No preview available</div>';
      }
      html += `<div class="label">${escapeHtml(previewMeta)}</div>`;
      html += '</div>';
    }
    html += '</div>';
  } else {
    html += '<div style="color:var(--text2);font-size:13px">No previews</div>';
  }
  html += '</div>';

  html += '<div class="section"><div class="section-title">Description</div>';
  if (d.description) {
    html += '<div class="desc-block">';
    html += `<div class="desc-label">Main</div><div class="desc-text">${escapeHtml(d.description.main_content || '-')}</div>`;
    html += `<div class="desc-label">Detail</div><div class="desc-text">${escapeHtml(d.description.detail_content || '-')}</div>`;
    html += '</div>';
  } else {
    html += '<div style="color:var(--red);font-size:13px">No description generated</div>';
  }
  html += '</div>';

  html += '<div class="section"><div class="section-title">Embedding</div>';
  if (d.embedding) {
    html += '<div class="embed-info">';
    html += `<div class="embed-chip"><div class="label">Dimension</div><div class="value">${escapeHtml(d.embedding.dimension)}</div></div>`;
    html += `<div class="embed-chip"><div class="label">Checksum</div><div class="value" style="font-size:11px;font-family:monospace">${escapeHtml(d.embedding.checksum || '-')}</div></div>`;
    html += `<div class="embed-chip"><div class="label">Model</div><div class="value">${escapeHtml(d.embedding.model_version || '-')}</div></div>`;
    html += '</div>';
  } else {
    html += '<div style="color:var(--red);font-size:13px">No embedding</div>';
  }
  html += '</div>';

  if (d.last_error) {
    html += `<div class="section"><div class="section-title" style="color:var(--red)">Last Error</div>`;
    html += `<div style="color:var(--red);font-size:13px;background:var(--panel2);padding:12px;border-radius:var(--radius)">${escapeHtml(d.last_error)}</div></div>`;
  }

  html += `<div class="section"><div class="section-title">${isPack ? 'Pack File List' : 'Files'}</div>`;
  if (d.files && d.files.length) {
    if (isPack) {
      html += '<table class="file-table"><thead><tr><th>Name</th><th>Format</th><th>Size</th><th>Role</th></tr></thead><tbody>';
    } else {
      html += '<table class="file-table"><thead><tr><th>Name</th><th>Format</th><th>Size</th><th>Role</th><th>Object Key</th><th></th></tr></thead><tbody>';
    }
    for (const f of d.files) {
      const objectKey = f.object_key || '-';
      const fileDownloadUrl = rid && f.file_id && f.object_key ? resourceFileDownloadUrl(rid, f.file_id) : '';
      html += '<tr>';
      html += `<td><b>${escapeHtml(f.file_name)}</b></td>`;
      html += `<td>${escapeHtml(f.file_format)}</td>`;
      html += `<td>${humanSize(f.file_size)}</td>`;
      html += `<td>${escapeHtml(f.file_role)}</td>`;
      if (!isPack) {
        html += `<td><code style="font-size:11px;color:var(--text2)">${escapeHtml(objectKey.length > 50 ? '...' + objectKey.slice(-47) : objectKey)}</code></td>`;
        html += `<td>${fileDownloadUrl ? '<a class="dl-link" href="' + escapeAttr(fileDownloadUrl) + '">Download</a>' : ''}</td>`;
      }
      html += '</tr>';
    }
    html += '</tbody></table>';
  } else {
    html += '<div style="color:var(--text2);font-size:13px">No files</div>';
  }
  html += '</div>';
  panel.innerHTML = html;
  bindPreviewZoom(panel);
}

function syncBrowseUrl(push) {
  const params = new URLSearchParams();
  if (state.query) params.set('q', state.query);
  if (state.resourceType) params.set('resource_type', state.resourceType);
  if (state.query) {
    if (state.topK !== 36) params.set('top_k', String(state.topK));
    if (state.similarityThreshold !== 0.5) params.set('threshold', String(state.similarityThreshold));
    if (state.searchMode !== 'hybrid') params.set('search_mode', state.searchMode);
    if (state.bm25Weight !== 0.5) params.set('bm25_weight', String(state.bm25Weight));
    if (state.enableReranker) params.set('reranker', state.enableReranker);
    if (state.formatFilter) params.set('format_filter', state.formatFilter);
  }
  const url = `${location.pathname}${params.toString() ? '?' + params.toString() : ''}`;
  history[push ? 'pushState' : 'replaceState']({
    view: 'grid',
    browseKey: browseViewKey(),
    scrollY: window.scrollY,
  }, '', url);
}

function rememberGridHistoryState() {
  history.replaceState({
    ...(history.state || {}),
    view: 'grid',
    browseKey: browseViewKey(),
    scrollY: window.scrollY,
  }, '', location.href);
}

function syncDetailUrl(id) {
  const params = new URLSearchParams(location.search);
  params.set('resource_id', id);
  history.pushState({ view: 'detail', resource_id: id }, '', `${location.pathname}?${params.toString()}`);
}

function applyFiltersFromUrl() {
  const params = new URLSearchParams(location.search);
  state.query = params.get('q') || '';
  state.resourceType = params.get('resource_type') || '';
  state.topK = parseNumber(params.get('top_k'), 36, 1, 120);
  state.similarityThreshold = parseNumber(params.get('threshold'), 0.5, 0, 1);
  state.searchMode = ['vector', 'bm25', 'hybrid'].includes(params.get('search_mode')) ? params.get('search_mode') : 'hybrid';
  state.bm25Weight = parseNumber(params.get('bm25_weight'), 0.5, 0, 1);
  state.enableReranker = params.get('reranker') || '';
  state.formatFilter = params.get('format_filter') || '';
  document.getElementById('searchInput').value = state.query;
  document.getElementById('typeFilter').value = state.resourceType;
  document.getElementById('topKInput').value = String(state.topK);
  document.getElementById('thresholdInput').value = String(state.similarityThreshold);
  document.getElementById('searchModeSelect').value = state.searchMode;
  document.getElementById('bm25WeightInput').value = String(state.bm25Weight);
  document.getElementById('rerankerSelect').value = state.enableReranker;
  document.getElementById('formatFilterInput').value = state.formatFilter;
  return params.get('resource_id') || '';
}

function runSearch() {
  state.query = document.getElementById('searchInput').value.trim();
  state.topK = parseNumber(document.getElementById('topKInput').value, 36, 1, 120);
  state.similarityThreshold = parseNumber(document.getElementById('thresholdInput').value, 0.5, 0, 1);
  state.searchMode = document.getElementById('searchModeSelect').value || 'hybrid';
  state.bm25Weight = parseNumber(document.getElementById('bm25WeightInput').value, 0.5, 0, 1);
  state.enableReranker = document.getElementById('rerankerSelect').value;
  state.formatFilter = document.getElementById('formatFilterInput').value.trim();
  document.getElementById('advancedSearch').open = false;
  showGrid(false);
  loadResources({ reset: true });
}

document.getElementById('searchButton').addEventListener('click', runSearch);
document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') runSearch();
});
document.addEventListener('click', e => {
  const advanced = document.getElementById('advancedSearch');
  if (advanced.open && !advanced.contains(e.target)) advanced.open = false;
});
document.getElementById('typeFilter').addEventListener('change', e => {
  state.resourceType = e.target.value;
  loadResources({ reset: true });
});
document.getElementById('resourceGrid').addEventListener('click', e => {
  const card = e.target.closest('.resource-card');
  if (card) selectResource(card.dataset.id, true);
});
for (const id of ['topKInput', 'thresholdInput', 'searchModeSelect', 'bm25WeightInput', 'rerankerSelect', 'formatFilterInput']) {
  const node = document.getElementById(id);
  node.addEventListener('keydown', e => {
    if (e.key === 'Enter') runSearch();
  });
}
document.getElementById('loadMoreButton').addEventListener('click', () => loadResources());
document.getElementById('backButton').addEventListener('click', () => showGrid(true));
lightbox.root = document.getElementById('previewLightbox');
lightbox.viewport = document.getElementById('previewLightboxViewport');
lightbox.image = document.getElementById('previewLightboxImage');
lightbox.caption = document.getElementById('previewLightboxCaption');
lightbox.zoomLevel = document.getElementById('previewZoomLevel');
lightbox.zoomIn = document.getElementById('previewZoomIn');
lightbox.zoomOut = document.getElementById('previewZoomOut');
lightbox.zoomReset = document.getElementById('previewZoomReset');
document.getElementById('previewLightboxClose').addEventListener('click', closePreviewLightbox);
lightbox.root.addEventListener('click', e => {
  if (e.target === lightbox.root) closePreviewLightbox();
});
lightbox.image.addEventListener('load', () => {
  lightbox.naturalWidth = lightbox.image.naturalWidth || 1;
  lightbox.naturalHeight = lightbox.image.naturalHeight || 1;
  fitPreviewZoom();
});
lightbox.zoomIn.addEventListener('click', () => applyPreviewZoom(lightbox.zoom + PREVIEW_ZOOM_STEP));
lightbox.zoomOut.addEventListener('click', () => applyPreviewZoom(lightbox.zoom - PREVIEW_ZOOM_STEP));
lightbox.zoomReset.addEventListener('click', fitPreviewZoom);
lightbox.viewport.addEventListener('wheel', e => {
  if (!lightbox.root || lightbox.root.classList.contains('hidden')) return;
  e.preventDefault();
  const rect = lightbox.viewport.getBoundingClientRect();
  const anchor = {
    x: e.clientX - rect.left,
    y: e.clientY - rect.top,
  };
  const direction = e.deltaY < 0 ? 1 : -1;
  applyPreviewZoom(lightbox.zoom + direction * PREVIEW_ZOOM_STEP, anchor);
}, { passive: false });
lightbox.viewport.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  const canDrag = lightbox.viewport.scrollWidth > lightbox.viewport.clientWidth
    || lightbox.viewport.scrollHeight > lightbox.viewport.clientHeight;
  if (!canDrag) return;
  lightbox.isDragging = true;
  lightbox.dragStartX = e.clientX;
  lightbox.dragStartY = e.clientY;
  lightbox.scrollStartLeft = lightbox.viewport.scrollLeft;
  lightbox.scrollStartTop = lightbox.viewport.scrollTop;
  lightbox.viewport.classList.add('is-dragging');
  lightbox.viewport.setPointerCapture(e.pointerId);
  e.preventDefault();
});
lightbox.viewport.addEventListener('pointermove', e => {
  if (!lightbox.isDragging) return;
  lightbox.viewport.scrollLeft = lightbox.scrollStartLeft - (e.clientX - lightbox.dragStartX);
  lightbox.viewport.scrollTop = lightbox.scrollStartTop - (e.clientY - lightbox.dragStartY);
});
function stopPreviewDrag(e) {
  if (!lightbox.isDragging) return;
  lightbox.isDragging = false;
  lightbox.viewport.classList.remove('is-dragging');
  if (e && lightbox.viewport.hasPointerCapture(e.pointerId)) {
    lightbox.viewport.releasePointerCapture(e.pointerId);
  }
}
lightbox.viewport.addEventListener('pointerup', stopPreviewDrag);
lightbox.viewport.addEventListener('pointercancel', stopPreviewDrag);
window.addEventListener('resize', updatePreviewDragState);
window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && lightbox.root && !lightbox.root.classList.contains('hidden')) {
    closePreviewLightbox();
    return;
  }
  if (!lightbox.root || lightbox.root.classList.contains('hidden')) return;
  if (e.key === '+' || e.key === '=') {
    e.preventDefault();
    applyPreviewZoom(lightbox.zoom + PREVIEW_ZOOM_STEP);
  } else if (e.key === '-') {
    e.preventDefault();
    applyPreviewZoom(lightbox.zoom - PREVIEW_ZOOM_STEP);
  } else if (e.key === '0') {
    e.preventDefault();
    fitPreviewZoom();
  }
});
window.addEventListener('popstate', async event => {
  closePreviewLightbox();
  const id = applyFiltersFromUrl();
  if (id) {
    await selectResource(id, false);
    return;
  }
  const browseKey = browseViewKey();
  if (state.loadedBrowseKey === browseKey) {
    showGrid(false);
    const scrollY = Number(event.state && event.state.scrollY) || 0;
    requestAnimationFrame(() => window.scrollTo(0, scrollY));
    return;
  }
  await loadResources({ reset: true, sync: false });
  showGrid(false);
});

async function init() {
  const initialId = applyFiltersFromUrl();
  loadStats();
  if (initialId) {
    await selectResource(initialId, false);
    return;
  }
  await loadResources({ reset: true, sync: true });
}

init();
</script>
</body>
</html>
